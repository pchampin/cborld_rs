[package]
name = "cborld"
description = "Implementation of CBOR-LD aiming to faithfully follow the specification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = "0.4"
reqwest = { version = "0.13", features = ["blocking"] }
serde_cbor = "0.11"
serde_json = "1"
test-case = "3"
thiserror = "2"
gc_value = "0.1"
uuid = "1"
strum = { version = "0.28", features = ["derive"] }
data-encoding = "2"
b58 = "0.1.2"

[build-dependencies]
cborld_test_factory.workspace = true
